[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-interaction"
version = "0.1.0"
description = "Camera → hand pose → abstract 2D interaction events"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["hand_interaction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
